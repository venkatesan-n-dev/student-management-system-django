{% extends 'students/base.html' %}


{% block content %}

<h1>{{ title }}</h1>


<form method="POST">

    {% csrf_token %}


    {% for field in form %}

    <div class="form-group">

        <label>

            {{ field.label }}

        </label>


        {{ field }}


        {% if field.errors %}

            <div class="error">

                {{ field.errors }}

            </div>

        {% endif %}

    </div>

    {% endfor %}


    <button
        type="submit"
        class="btn"
    >
        Save
    </button>


    <a
        href="{% url 'student_list' %}"
        class="btn"
    >
        Cancel
    </a>

</form>


{% endblock %}
