{% extends 'students/base.html' %}


{% block content %}

<h1>Delete Student</h1>


<p>

    Are you sure you want to delete

    <strong>
        {{ student.name }}
    </strong>

    ?

</p>


<form method="POST">

    {% csrf_token %}


    <button
        type="submit"
        class="btn"
    >
        Yes, Delete
    </button>


    <a
        href="{% url 'student_list' %}"
        class="btn"
    >
        Cancel
    </a>

</form>


{% endblock %}
