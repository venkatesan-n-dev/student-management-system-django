<!DOCTYPE html>

<html>

<head>

    <title>Student Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        h1 {
            color: #333;
        }

        a {
            text-decoration: none;
        }

        .btn {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 4px;
            background-color: #333;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #eee;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .error {
            color: red;
        }

    </style>

</head>


<body>

<div class="container">

    {% block content %}

    {% endblock %}

</div>

</body>

</html>
